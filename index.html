<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Gallery — Original Art for Sale</title>
<meta name="description" content="A curated online art gallery. Browse and buy original artworks.">
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --line:#e6e2dc; --bg:#faf8f5; --accent:#8a5a2b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; color:var(--ink); background:var(--bg); }
  h1,h2,h3 { font-weight: normal; margin:0; }
  header { display:flex; justify-content:space-between; align-items:center; padding:20px 32px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .logo { font-size:24px; letter-spacing:.12em; text-transform:uppercase; }
  button { font-family: inherit; cursor:pointer; }
  .cart-btn { background:none; border:1px solid var(--ink); padding:8px 16px; font-size:14px; }
  .cart-btn:hover { background:var(--ink); color:#fff; }
  .hero { text-align:center; padding:64px 20px 32px; }
  .hero h1 { font-size:42px; }
  .hero p { color:var(--muted); max-width:520px; margin:12px auto 0; line-height:1.5; }
  .filters { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:16px 20px 28px; }
  .chip { border:1px solid var(--line); background:#fff; padding:6px 14px; font-size:13px; border-radius:20px; }
  .chip.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:28px; padding:0 32px 64px; max-width:1200px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.08); }
  .card img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:#eee; }
  .card .info { padding:14px 16px 18px; }
  .card h3 { font-size:17px; }
  .card .artist { color:var(--muted); font-size:14px; margin-top:4px; }
  .card .price { margin-top:10px; color:var(--accent); font-size:16px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:20; padding:16px; }
  .overlay.open { display:flex; }
  .modal { background:#fff; max-width:860px; width:100%; max-height:92vh; overflow:auto; display:grid; grid-template-columns:1fr 1fr; }
  .modal img { width:100%; height:100%; object-fit:cover; min-height:300px; }
  .modal .body { padding:28px; display:flex; flex-direction:column; gap:10px; }
  .close { align-self:flex-end; background:none; border:none; font-size:26px; line-height:1; }
  .primary { background:var(--ink); color:#fff; border:none; padding:12px 20px; font-size:15px; margin-top:8px; }
  .primary:hover { background:var(--accent); }
  .primary:disabled { opacity:.5; cursor:not-allowed; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); background:#fff; transform:translateX(100%); transition:transform .25s; z-index:30; display:flex; flex-direction:column; box-shadow:-8px 0 24px rgba(0,0,0,.12); }
  .drawer.open { transform:none; }
  .drawer header { position:static; padding:16px 20px; }
  .drawer .items { flex:1; overflow:auto; padding:8px 20px; }
  .line-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); align-items:center; }
  .line-item img { width:56px; height:70px; object-fit:cover; }
  .line-item .t { flex:1; font-size:15px; }
  .line-item .t small { color:var(--muted); display:block; }
  .link { background:none; border:none; color:var(--muted); text-decoration:underline; font-size:13px; }
  .drawer .foot { padding:16px 20px; border-top:1px solid var(--line); }
  .total { display:flex; justify-content:space-between; font-size:18px; margin-bottom:10px; }
  form.checkout { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  input, textarea { font-family:inherit; font-size:15px; padding:10px; border:1px solid var(--line); width:100%; }
  .msg { padding:10px; font-size:14px; margin-top:8px; }
  .msg.ok { background:#eaf5ea; color:#1f5a1f; }
  .msg.err { background:#fdeaea; color:#7a1f1f; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  footer { text-align:center; color:var(--muted); font-size:13px; padding:28px; border-top:1px solid var(--line); }
  @media (max-width:700px){ .modal{grid-template-columns:1fr;} .grid{padding:0 16px 40px;} header{padding:16px;} }
</style>
</head>
<body>
<header>
  <div class="logo">Atelier</div>
  <button class="cart-btn" id="openCart">Cart (<span id="cartCount">0</span>)</button>
</header>

<section class="hero">
  <h1>Original art, directly from the artists</h1>
  <p>Browse our current collection. Every piece is one of a kind.</p>
</section>
<div class="filters" id="filters"></div>
<main class="grid" id="grid"><div class="empty">Loading artworks…</div></main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<aside class="drawer" id="drawer">
  <header><h2>Your cart</h2><button class="close" id="closeCart" aria-label="Close cart">×</button></header>
  <div class="items" id="cartItems"></div>
  <div class="foot" id="cartFoot"></div>
</aside>

<footer>© <span id="yr"></span> Atelier Gallery · Demo store — no real payments are taken.</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://kjxkpkimrdzztaucqfnn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_hKu86gVK6iE_tv1UW03Uzg_fG_2e6KL';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const money = (n) => '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let artworks = [];
let activeCategory = 'All';
let cart = [];
try { cart = JSON.parse(localStorage.getItem('cart') || '[]'); } catch { cart = []; }
const saveCart = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch {} };

$('yr').textContent = new Date().getFullYear();

async function load() {
  const { data, error } = await supabase.from('artworks').select('*').eq('in_stock', true).order('created_at', { ascending: false });
  if (error) { $('grid').innerHTML = `<div class="empty">Could not load artworks: ${esc(error.message)}</div>`; return; }
  artworks = data;
  // drop cart items that no longer exist
  cart = cart.filter((id) => artworks.some((a) => a.id === id));
  saveCart();
  renderFilters(); renderGrid(); renderCart();
}

function renderFilters() {
  const cats = ['All', ...new Set(artworks.map((a) => a.category))];
  $('filters').innerHTML = cats.map((c) => `<button class="chip ${c === activeCategory ? 'active' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('filters').querySelectorAll('.chip').forEach((b) => b.onclick = () => { activeCategory = b.dataset.c; renderFilters(); renderGrid(); });
}

function renderGrid() {
  const list = artworks.filter((a) => activeCategory === 'All' || a.category === activeCategory);
  if (!list.length) { $('grid').innerHTML = '<div class="empty">No artworks found.</div>'; return; }
  $('grid').innerHTML = list.map((a) => `
    <article class="card" data-id="${a.id}">
      <img loading="lazy" src="${esc(a.image_url)}" alt="${esc(a.title)}">
      <div class="info"><h3>${esc(a.title)}</h3><div class="artist">${esc(a.artist)}</div><div class="price">${money(a.price)}</div></div>
    </article>`).join('');
  $('grid').querySelectorAll('.card').forEach((c) => c.onclick = () => openModal(Number(c.dataset.id)));
}

function openModal(id) {
  const a = artworks.find((x) => x.id === id); if (!a) return;
  const inCart = cart.includes(id);
  $('modal').innerHTML = `
    <img src="${esc(a.image_url)}" alt="${esc(a.title)}">
    <div class="body">
      <button class="close" id="closeModal" aria-label="Close">×</button>
      <h2>${esc(a.title)}</h2>
      <div style="color:var(--muted)">${esc(a.artist)} · ${esc(a.category)}</div>
      <p style="line-height:1.6">${esc(a.description)}</p>
      <div style="font-size:22px;color:var(--accent)">${money(a.price)}</div>
      <button class="primary" id="addBtn" ${inCart ? 'disabled' : ''}>${inCart ? 'In your cart' : 'Add to cart'}</button>
    </div>`;
  $('overlay').classList.add('open');
  $('closeModal').onclick = closeModal;
  $('addBtn').onclick = () => { if (!cart.includes(id)) cart.push(id); saveCart(); renderCart(); closeModal(); openCart(); };
}
function closeModal() { $('overlay').classList.remove('open'); }
$('overlay').onclick = (e) => { if (e.target === $('overlay')) closeModal(); };

function cartItems() { return cart.map((id) => artworks.find((a) => a.id === id)).filter(Boolean); }

function renderCart() {
  const items = cartItems();
  $('cartCount').textContent = items.length;
  if (!items.length) { $('cartItems').innerHTML = '<div class="empty">Your cart is empty.</div>'; $('cartFoot').innerHTML = ''; return; }
  $('cartItems').innerHTML = items.map((a) => `
    <div class="line-item">
      <img src="${esc(a.image_url)}" alt="">
      <div class="t">${esc(a.title)}<small>${esc(a.artist)} · ${money(a.price)}</small></div>
      <button class="link" data-rm="${a.id}">Remove</button>
    </div>`).join('');
  $('cartItems').querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => { cart = cart.filter((id) => id !== Number(b.dataset.rm)); saveCart(); renderCart(); });
  const total = items.reduce((s, a) => s + Number(a.price), 0);
  $('cartFoot').innerHTML = `
    <div class="total"><span>Total</span><strong>${money(total)}</strong></div>
    <form class="checkout" id="checkout">
      <input name="name" placeholder="Full name" required maxlength="120">
      <input name="email" type="email" placeholder="Email" required maxlength="200">
      <textarea name="address" placeholder="Shipping address" rows="3" required maxlength="500"></textarea>
      <button class="primary" type="submit" id="placeBtn">Place order</button>
      <div id="orderMsg"></div>
    </form>`;
  $('checkout').onsubmit = placeOrder;
}

async function placeOrder(e) {
  e.preventDefault();
  const items = cartItems();
  if (!items.length) return;
  const f = new FormData(e.target);
  const btn = $('placeBtn'); btn.disabled = true; btn.textContent = 'Placing order…';
  const total = items.reduce((s, a) => s + Number(a.price), 0);
  const { error } = await supabase.from('orders').insert({
    customer_name: String(f.get('name')).trim(),
    customer_email: String(f.get('email')).trim(),
    shipping_address: String(f.get('address')).trim(),
    items: items.map((a) => ({ id: a.id, title: a.title, artist: a.artist, price: a.price })),
    total
  });
  if (error) {
    $('orderMsg').innerHTML = `<div class="msg err">Could not place order: ${esc(error.message)}</div>`;
    btn.disabled = false; btn.textContent = 'Place order';
    return;
  }
  cart = []; saveCart();
  $('cartItems').innerHTML = '';
  $('cartFoot').innerHTML = '<div class="msg ok">Thank you! Your order has been received. We will email you to arrange payment and delivery.</div>';
  $('cartCount').textContent = 0;
}

function openCart() { $('drawer').classList.add('open'); }
$('openCart').onclick = openCart;
$('closeCart').onclick = () => $('drawer').classList.remove('open');

load();
</script>
</body>
</html>
