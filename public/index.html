<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deko Arts Gallery — Original African Art, Commissions &amp; Prints</title>
<meta name="description" content="Deko Arts Gallery: buy original artworks, commission custom pieces and pay with M-Pesa or PayPal.">
<style>
:root{--bg:#0f0e0d;--panel:#1a1816;--panel2:#221f1c;--line:#34302b;--text:#f3ede2;--muted:#a79f92;--gold:#c9a24b;--gold2:#e2c377;--ok:#4caf7a;--bad:#e0675b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:normal;margin:0 0 .4em}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:rgba(15,14,13,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{font-size:20px;letter-spacing:.18em;text-transform:uppercase}.brand span{color:var(--gold)}
.top nav{display:flex;align-items:center;gap:20px;font-size:15px;flex-wrap:wrap}
.top nav a{color:var(--muted)}.top nav a:hover,.top nav a.on{color:var(--gold2)}
.btn{display:inline-block;background:var(--gold);color:#17130b;border:0;padding:11px 20px;cursor:pointer;letter-spacing:.04em;font-size:15px}
.btn:hover{background:var(--gold2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--gold);color:var(--gold2)}
.btn.sm{padding:6px 12px;font-size:13px}.btn.danger{background:var(--bad);color:#fff}
.cartbtn{background:transparent;border:1px solid var(--gold);color:var(--gold2);padding:7px 14px;cursor:pointer}
.cartbtn b{background:var(--gold);color:#17130b;border-radius:10px;padding:0 7px;margin-left:6px;font-size:13px}
main{min-height:70vh}
.wrap{max-width:1180px;margin:0 auto;padding:28px}
.hero{text-align:center;padding:70px 20px 40px;background:radial-gradient(ellipse at top,#2a2217 0,var(--bg) 70%)}
.hero h1{font-size:clamp(30px,5vw,54px);letter-spacing:.04em}.hero p{color:var(--muted);max-width:620px;margin:10px auto 22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);padding:10px 12px;width:100%}
.tools input{flex:2;min-width:180px}.tools select{flex:1;min-width:140px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--panel);border:1px solid var(--line);display:block;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--gold)}
.card .img{position:relative;aspect-ratio:4/5;background:#000}.card img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:10px;left:10px;background:var(--bad);color:#fff;font-size:12px;padding:2px 8px;letter-spacing:.06em}
.card .info{padding:14px 16px 18px}.card h3{font-size:18px}.muted{color:var(--muted)}.price{color:var(--gold2);font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px}
.two img.big{width:100%;border:1px solid var(--line);display:block}
.panel{background:var(--panel);border:1px solid var(--line);padding:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stack>*{margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line)}.qty button{background:none;border:0;width:32px;height:32px;cursor:pointer;color:var(--gold2);font-size:18px}.qty span{min-width:30px;text-align:center}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.25s;z-index:40;display:flex;flex-direction:column}
#drawer.open{transform:none}#drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
#dlines{flex:1;overflow:auto;padding:6px 20px}#dfoot{padding:16px 20px;border-top:1px solid var(--line)}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.line img{width:54px;height:68px;object-fit:cover}.line .t{flex:1;font-size:15px}
.sum{display:flex;justify-content:space-between;margin:4px 0}.sum.total{font-size:19px;color:var(--gold2);border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}.shade.on{display:block}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel2);border:1px solid var(--gold);padding:10px 18px;box-shadow:0 6px 20px rgba(0,0,0,.5)}.toast.err{border-color:var(--bad)}
.note{padding:12px 14px;border:1px solid var(--line);margin:12px 0}.note.ok{border-color:var(--ok)}.note.err{border-color:var(--bad)}
.steps{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.steps span{padding:4px 12px;border:1px solid var(--line);font-size:13px;color:var(--muted)}.steps span.on{border-color:var(--gold);color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-weight:normal;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.scroll{overflow:auto}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}.tabs button{background:var(--panel);border:1px solid var(--line);padding:8px 16px;cursor:pointer;color:var(--muted)}.tabs button.on{border-color:var(--gold);color:var(--gold2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);padding:16px}.stat b{display:block;font-size:24px;color:var(--gold2)}
.thumb{width:44px;height:54px;object-fit:cover;background:#000}
footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--muted);font-size:14px;margin-top:40px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle;margin-right:8px}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:760px){.two,.row{grid-template-columns:1fr}.top{padding:12px 16px}.wrap{padding:18px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Deko <span>Arts</span> Gallery</a>
  <nav>
    <a href="#/" data-nav="shop">Shop</a>
    <a href="#/commission" data-nav="commission">Commissions</a>
    <a href="#/track" data-nav="track">Track order</a>
    <a href="#/contact" data-nav="contact">Contact</a>
    <button class="cartbtn" id="cartBtn" aria-label="Open cart">Cart <b id="cartN">0</b></button>
  </nav>
</header>
<main id="view"></main>
<footer>
  <div>© <span id="yr"></span> Deko Arts Gallery · Pay with M-Pesa or PayPal · Delivery across Kenya</div>
  <div style="margin-top:6px"><a href="#/admin" style="color:var(--line)">Staff</a></div>
</footer>
<div class="shade" id="shade"></div>
<aside id="drawer" aria-label="Shopping cart">
  <header><h2 style="margin:0">Your cart</h2><button class="btn ghost sm" id="closeDrawer">Close</button></header>
  <div id="dlines"></div>
  <div id="dfoot"></div>
</aside>
<div id="toast"></div>
<script src="js/api-mode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
